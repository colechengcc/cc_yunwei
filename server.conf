#################################################
# OpenVPN 服务器配置文件
# 支持证书 + 用户名密码双重认证
#################################################

# 监听端口
port 49512

# 协议类型（UDP性能更好，TCP更稳定）
proto udp

# 虚拟网络设备类型
dev tun

# SSL/TLS 证书配置
ca /etc/openvpn/easy-rsa/pki/ca.crt
cert /etc/openvpn/easy-rsa/pki/issued/server.crt
key /etc/openvpn/easy-rsa/pki/private/server.key  # This file should be kept secret

# Diffie hellman参数
dh /etc/openvpn/easy-rsa/pki/dh.pem

# TLS认证密钥（额外的安全层）
tls-auth /etc/openvpn/easy-rsa/ta.key 0 # This file is secret

# VPN网络配置
# 服务器将使用10.8.0.1，客户端将从10.8.0.2-10.8.0.254分配IP
server 10.8.0.0 255.255.255.0

# 维护客户端IP分配记录
ifconfig-pool-persist ipp.txt

# 用户名密码验证配置
# 这是实现双重认证的关键配置
auth-user-pass-verify /etc/openvpn/checkpsw.sh via-env
script-security 3
username-as-common-name

# 允许使用证书的CN作为用户名（用于username-as-common-name）
# 但同时需要密码验证
verify-client-cert require

# TLS密钥方向
key-direction 0

# 保持连接活跃
# 每10秒ping一次，120秒无响应则认为连接断开
keepalive 10 120

# 加密算法
cipher AES-256-CBC

# 推送路由到客户端
# 客户端可以通过VPN访问这些网络
push "route 172.17.5.68 255.255.255.255"
push "route 172.17.5.69 255.255.255.255"

# 推送DNS服务器到客户端
push "dhcp-option DNS 192.168.222.72"

# 如果需要客户端所有流量都通过VPN，取消下面的注释
# push "redirect-gateway def1 bypass-dhcp"
# push "dhcp-option DNS 8.8.8.8"
# push "dhcp-option DNS 8.8.4.4"

# 允许客户端之间互相访问（如果需要）
# client-to-client

# 允许多个客户端使用同一个证书（仅用于测试，生产环境不推荐）
# duplicate-cn

# 持久化选项
persist-key
persist-tun

# 状态日志文件
status openvpn-status.log

# 日志级别
# 0 = 静默，仅致命错误
# 4 = 适合一般使用
# 5-6 = 帮助调试连接问题
# 9 = 极详细
verb 3

# 服务器重启时通知客户端
explicit-exit-notify 1

# 最大并发客户端数（可选）
# max-clients 100

# 降低权限（Linux系统推荐，提高安全性）
# user nobody
# group nobody

# 压缩（可选，可以提高性能但增加CPU使用）
# compress lz4-v2
# push "compress lz4-v2"
